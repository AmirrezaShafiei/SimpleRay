plugins { id 'com.android.application' }

def sideBySide = providers.gradleProperty('sideBySide').map { it.toBoolean() }.orElse(false)

android {
    namespace 'io.github.amirrezashafiei.simpleray'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.amirrezashafiei.simpleray.mobile'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.2.0-beta.2'
        manifestPlaceholders = [launcherLabel: 'SimpleRAY']
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        debug {
            if (sideBySide.get()) {
                applicationIdSuffix '.preview'
                manifestPlaceholders = [launcherLabel: 'SimpleRAY Preview']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs.useLegacyPackaging = true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('sharedAssets')
}

def desktopFiles = ['config.js', 'extra-profiles.js', 'xray-config.js', 'theme.js',
                    'color-wheel.js', 'palettes.css', 'icons.svg', 'model.js', 'runtime.js', 'store.js', 'portable-backup.js', 'flags.js', 'countries.js']
tasks.register('stageDesktopModules', Sync) {
    from(rootProject.file('../frontend')) { include desktopFiles }
    into layout.buildDirectory.dir('sharedAssets/shared')
}
tasks.named('preBuild').configure { dependsOn 'stageDesktopModules' }

dependencies {
    implementation files('libs/libXray.aar', 'libs/hev-socks5-tunnel.aar')
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
