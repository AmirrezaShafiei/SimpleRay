name: Cancel superseded SimpleRay preview build
on:
  push:
    branches: [automation/promote-beta-11]
    paths: [.github/workflows/cancel-superseded-beta-build.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Stop the superseded beta.12 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 45376303209 --repo "$GITHUB_REPOSITORY"
