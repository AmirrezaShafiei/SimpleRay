name: SimpleRay Windows beta (candidate)

on:
  push:
    branches: [main, build/simpleray-stable12]
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-beta:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript build dependencies
        run: npm ci --no-audit --no-fund
      - name: Test JavaScript modules and UI structure
        run: npm test
      - name: Check source and version consistency
        run: npm run build
      - name: Fetch pinned official Xray-core for Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v26.11.9'
          $file = 'Xray-windows-64.zip'
          $expectedSha256 = '1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d'
          $url = "https://github.com/XTLS/Xray-core/releases/download/$version/$file"
          Invoke-WebRequest -Uri $url -OutFile $file
          Invoke-WebRequest -Uri "$url.dgst" -OutFile "$file.dgst"
          if (!(Get-Content "$file.dgst" -Raw).ToLowerInvariant().Contains($expectedSha256)) { throw 'Official Xray digest manifest disagrees with pinned SHA256' }
          $found = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($found -ne $expectedSha256) { throw "Pinned Xray archive SHA256 mismatch: $found" }
          New-Item -ItemType Directory -Force src-tauri/binaries,src-tauri/licenses | Out-Null
          Expand-Archive -LiteralPath $file -DestinationPath official-xray
          foreach ($asset in @('xray.exe','geoip.dat','geosite.dat')) {
            $foundAsset = Get-ChildItem -Path official-xray -File -Recurse -Filter $asset | Select-Object -First 1
            if (!$foundAsset) { throw "Expected official Xray asset missing: $asset" }
            Copy-Item $foundAsset.FullName "src-tauri/binaries/$asset"
          }
          $license = Get-ChildItem -Path official-xray -File -Recurse | Where-Object { $_.Name -match '^LICENSE(\.md|\.txt)?$' } | Select-Object -First 1
          if (!$license) { throw 'Official Xray license missing from release archive' }
          Copy-Item $license.FullName 'src-tauri/licenses/XRAY-LICENSE.txt' -Force
          & 'src-tauri/binaries/xray.exe' version
      - name: Stage pinned Wintun for Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.14.1'
          $file = "wintun-$version.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/$file" -OutFile $file
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Wintun ZIP hash mismatch' }
          Expand-Archive -LiteralPath $file -DestinationPath official-wintun
          Copy-Item 'official-wintun/wintun/bin/amd64/wintun.dll' 'src-tauri/binaries/wintun.dll'
          Copy-Item 'official-wintun/wintun/LICENSE.txt' 'src-tauri/licenses/WINTUN-LICENSE.txt'
      - name: Validate official Xray API configuration shape
        shell: pwsh
        run: |
          & 'src-tauri/binaries/xray.exe' run -test -config 'tests/fixtures/xray-api.json'
          if ($LASTEXITCODE -ne 0) { throw 'Xray rejected sample core configuration' }
      - name: Compile and test Rust native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Windows System Proxy set and restore
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml wininet_system_proxy_round_trip -- --ignored
      - name: Verify the Xray TUN adapter starts on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml windows_tun_adapter_smoke -- --ignored
      - name: Build Windows NSIS installer
        run: npm run desktop:build -- -- --locked
      - name: Verify installation and application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File | Select-Object -First 1
          if (!$setup) { throw 'Windows installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'SimpleRay-smoke'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @('/S',"/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "NSIS install failed: $($installer.ExitCode)" }
          foreach ($file in @('simpleray.exe','binaries/xray.exe','binaries/geoip.dat','binaries/geosite.dat','binaries/wintun.dll','licenses/XRAY-LICENSE.txt','licenses/WINTUN-LICENSE.txt')) {
            if (!(Test-Path (Join-Path $installDir $file) -PathType Leaf)) { throw "Installed resource missing: $file" }
          }
          & (Join-Path $installDir 'binaries/xray.exe') run -test -config 'tests/fixtures/xray-api.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installed Xray failed validation' }
          $exe = Join-Path $installDir 'simpleray.exe'
          $registry = [Microsoft.Win32.Registry]::CurrentUser
          $runKey = $registry.CreateSubKey('Software\Microsoft\Windows\CurrentVersion\Run')
          $prefKey = $registry.CreateSubKey('Software\SimpleRay')
          $startupValue = $runKey.GetValue('SimpleRay')
          $preferenceValue = $prefKey.GetValue('StartWithWindows')
          $runKey.DeleteValue('SimpleRay', $false)
          $prefKey.DeleteValue('StartWithWindows', $false)
          $debugListener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $debugListener.Start()
          $debugPort = $debugListener.LocalEndpoint.Port
          $debugListener.Stop()
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$debugPort"
          $stderr = Join-Path $env:RUNNER_TEMP 'simpleray-smoke-stderr.txt'
          $first = Start-Process -FilePath $exe -RedirectStandardError $stderr -PassThru
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          try {
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $first.Refresh()
              if ($first.HasExited) { throw "Installed app quit during startup: $($first.ExitCode)" }
              if ($first.MainWindowHandle -ne 0) { break }
            }
            if ($first.MainWindowHandle -eq 0) { throw 'Installed app did not open a window' }
            $expectedStartup = '"' + $exe + '" --minimized'
            for ($i=0; $i -lt 15; $i++) {
              $actualStartup = $runKey.GetValue('SimpleRay')
              if ($null -ne $actualStartup) { break }
              Start-Sleep -Seconds 1
            }
            if ($actualStartup -ne $expectedStartup) { throw "Start with Windows was not registered by default: $actualStartup" }
            node scripts/tray-webview-smoke.mjs $debugPort
            if ($LASTEXITCODE -ne 0) { throw 'Installed tray WebView checks failed' }
            $second = Start-Process -FilePath $exe -PassThru
            try {
              if (!$second.WaitForExit(10000)) { throw 'Second instance did not exit' }
              if ($first.HasExited) { throw 'Second launch closed the original app' }
            } finally {
              if (!$second.HasExited) { Stop-Process -Id $second.Id -Force }
            }
          } catch {
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            throw
          } finally {
            if (!$first.HasExited) { Stop-Process -Id $first.Id -Force }
            $first.WaitForExit()
          }
          try {
            $prefKey.SetValue('StartWithWindows', 0, [Microsoft.Win32.RegistryValueKind]::DWord)
            $disabled = Start-Process -FilePath $exe -PassThru
            try {
              for ($i=0; $i -lt 20 -and $disabled.MainWindowHandle -eq 0; $i++) {
                Start-Sleep -Seconds 1
                $disabled.Refresh()
                if ($disabled.HasExited) { throw 'App exited during startup opt-out check' }
              }
              if ($disabled.MainWindowHandle -eq 0) { throw 'App did not open to check startup opt-out' }
              if ($null -ne $runKey.GetValue('SimpleRay')) { throw 'App did not honor the startup opt-out' }
            } finally {
              if (!$disabled.HasExited) { Stop-Process -Id $disabled.Id -Force }
              $disabled.WaitForExit()
            }
            $runKey.SetValue('SimpleRay', $expectedStartup, [Microsoft.Win32.RegistryValueKind]::String)
            $uninstall = Start-Process -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S' -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
            if ($null -ne $runKey.GetValue('SimpleRay')) { throw 'The uninstaller left its startup entry behind' }
          } finally {
            if ($null -ne $startupValue) {
              $runKey.SetValue('SimpleRay', $startupValue, [Microsoft.Win32.RegistryValueKind]::String)
            } else { $runKey.DeleteValue('SimpleRay', $false) }
            if ($null -ne $preferenceValue) {
              $prefKey.SetValue('StartWithWindows', $preferenceValue, [Microsoft.Win32.RegistryValueKind]::DWord)
            } else { $prefKey.DeleteValue('StartWithWindows', $false) }
            $runKey.Dispose()
            $prefKey.Dispose()
          }
      - name: Publish the tested stable 1.2 installer
        if: github.ref == 'refs/heads/build/simpleray-stable12'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/build/simpleray-stable12" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the stable build commit' }
          if ($current -ne $env:GITHUB_SHA) { Write-Host 'This build was superseded'; exit 0 }
          $version = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne 'v1.2.0') { throw "Unexpected stable version: $version" }
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File | Select-Object -First 1
          if (!$installer) { throw 'No tested NSIS installer' }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = Join-Path $installer.DirectoryName 'SHA256SUMS.txt'
          "$checksum  $($installer.Name)" | Set-Content -Path $checksumFile -Encoding ascii
          gh release create $version $installer.FullName $checksumFile --latest --target $env:GITHUB_SHA --title "SimpleRAY 1.2 (Stable, Windows x64)" --notes "Ping All returns to the staged 1.1.2 behavior and tests up to four servers simultaneously in each stage. Test download transfers up to 3 MB and uses a speedometer icon. Includes the tested Windows x64 installer and its SHA-256 checksum."
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the installer' }
          Write-Host "$checksum  $($installer.Name)"
      - name: Publish beta pre-release after successful build and tests
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='v'+(Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
          if (!$installers) { throw 'No NSIS installer to publish' }
          $shaPath = Join-Path $installers[0].DirectoryName 'SHA256SUMS.txt'
          $checksum = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installers[0].Name)" | Set-Content -Path $shaPath -Encoding ascii
          gh release view $version 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $installers[0].FullName $shaPath --clobber
          } else {
            gh release create $version $installers[0].FullName $shaPath --target $env:GITHUB_SHA --title "SimpleRay $version (unsigned Windows beta)" --prerelease --notes 'Automated JS and Rust tests, NSIS installation, application startup and single-instance checks passed. Real user profiles, interactive tray behavior and Windows sign-in still require testing. Includes Xray-core v26.11.9 (MPL-2.0).'
          }
