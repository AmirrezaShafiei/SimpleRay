name: SimpleRay Windows beta (candidate)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-beta:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript build dependencies
        run: npm ci --no-audit --no-fund
      - name: Test JavaScript modules and UI structure
        run: npm test
      - name: Check source and version consistency
        run: npm run build
      - name: Fetch pinned official Xray-core for Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v26.11.9'
          $file = 'Xray-windows-64.zip'
          $expectedSha256 = '1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d'
          $url = "https://github.com/XTLS/Xray-core/releases/download/$version/$file"
          Invoke-WebRequest -Uri $url -OutFile $file
          Invoke-WebRequest -Uri "$url.dgst" -OutFile "$file.dgst"
          if (!(Get-Content "$file.dgst" -Raw).ToLowerInvariant().Contains($expectedSha256)) { throw 'Official Xray digest manifest disagrees with pinned SHA256' }
          $found = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($found -ne $expectedSha256) { throw "Pinned Xray archive SHA256 mismatch: $found" }
          New-Item -ItemType Directory -Force src-tauri/binaries,src-tauri/licenses | Out-Null
          Expand-Archive -LiteralPath $file -DestinationPath official-xray
          foreach ($asset in @('xray.exe','geoip.dat','geosite.dat')) {
            $foundAsset = Get-ChildItem -Path official-xray -File -Recurse -Filter $asset | Select-Object -First 1
            if (!$foundAsset) { throw "Expected official Xray asset missing: $asset" }
            Copy-Item $foundAsset.FullName "src-tauri/binaries/$asset"
          }
          $license = Get-ChildItem -Path official-xray -File -Recurse | Where-Object { $_.Name -match '^LICENSE(\.md|\.txt)?$' } | Select-Object -First 1
          if (!$license) { throw 'Official Xray license missing from release archive' }
          Copy-Item $license.FullName 'src-tauri/licenses/XRAY-LICENSE.txt' -Force
          & 'src-tauri/binaries/xray.exe' version
      - name: Validate official Xray API configuration shape
        shell: pwsh
        run: |
          & 'src-tauri/binaries/xray.exe' run -test -config 'tests/fixtures/xray-api.json'
          if ($LASTEXITCODE -ne 0) { throw 'Xray rejected sample core configuration' }
      - name: Compile and test Rust native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows NSIS installer
        run: npm run desktop:build -- -- --locked
      - name: Verify installation and application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File | Select-Object -First 1
          if (!$setup) { throw 'Windows installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'SimpleRay-smoke'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @('/S',"/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "NSIS install failed: $($installer.ExitCode)" }
          foreach ($file in @('simpleray.exe','binaries/xray.exe','binaries/geoip.dat','binaries/geosite.dat','licenses/XRAY-LICENSE.txt')) {
            if (!(Test-Path (Join-Path $installDir $file) -PathType Leaf)) { throw "Installed resource missing: $file" }
          }
          & (Join-Path $installDir 'binaries/xray.exe') run -test -config 'tests/fixtures/xray-api.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installed Xray failed validation' }
          $exe = Join-Path $installDir 'simpleray.exe'
          $first = Start-Process -FilePath $exe -PassThru
          try {
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $first.Refresh()
              if ($first.HasExited) { throw "Installed app quit during startup: $($first.ExitCode)" }
              if ($first.MainWindowHandle -ne 0) { break }
            }
            if ($first.MainWindowHandle -eq 0) { throw 'Installed app did not open a window' }
            $second = Start-Process -FilePath $exe -PassThru
            try {
              if (!$second.WaitForExit(10000)) { throw 'Second instance did not exit' }
              if ($first.HasExited) { throw 'Second launch closed the original app' }
            } finally {
              if (!$second.HasExited) { Stop-Process -Id $second.Id -Force }
            }
          } finally {
            if (!$first.HasExited) { Stop-Process -Id $first.Id -Force }
          }
      - name: Publish beta pre-release after successful build and tests
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='v'+(Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
          if (!$installers) { throw 'No NSIS installer to publish' }
          $shaPath = Join-Path $installers[0].DirectoryName 'SHA256SUMS.txt'
          $checksum = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installers[0].Name)" | Set-Content -Path $shaPath -Encoding ascii
          gh release view $version 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $installers[0].FullName $shaPath --clobber
          } else {
            gh release create $version $installers[0].FullName $shaPath --target $env:GITHUB_SHA --title "SimpleRay $version (unsigned Windows beta)" --prerelease --notes 'Automated JS and Rust tests, NSIS installation, application startup and single-instance checks passed. Real user profiles, interactive tray behavior and Windows sign-in still require testing. Includes Xray-core v26.11.9 (MPL-2.0).'
          }
