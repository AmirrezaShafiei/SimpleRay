[package]
name = "simpleray"
version = "1.2.5-beta"
description = "SimpleRay minimal Windows Xray client"
authors = ["SimpleRay contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simpleray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync", "rt", "macros"] }
tempfile = "3"
getrandom = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
if-addrs = "0.14"
form_urlencoded = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinInet"] }
winreg = "0.52"
