[package]
name = "simpleray"
version = "0.1.0"
description = "SimpleRay minimal desktop client"
authors = ["SimpleRay contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simpleray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Phase 2 native subscription fetch and clipboard support.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
arboard = "3.4"
